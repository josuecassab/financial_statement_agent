# Deploy the ADK financial statement agent to Cloud Run:
# https://adk-financial-statement-agent-711686050291.us-east1.run.app
#
# Required GitHub secret:
#     GCP_SA_KEY                      JSON key for a deployer SA
#
# Optional secrets (merged into the Cloud Run service if set):
#     ROOT_AGENT_MODEL
#     SUB_AGENTS_MODEL
#
# The deployer SA needs Cloud Run Admin, Service Account User, Cloud Build Editor,
# Artifact Registry Writer, and Storage Admin (source uploads).

name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: pf-zerogasto-dev
  REGION: us-east1
  SERVICE_NAME: adk-financial-statement-agent
  APP_NAME: financial_statement_agent

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ADK
        run: pip install -r requirements.txt

      - name: Deploy agent
        env:
          ROOT_AGENT_MODEL: ${{ secrets.ROOT_AGENT_MODEL }}
          SUB_AGENTS_MODEL: ${{ secrets.SUB_AGENTS_MODEL }}
        run: |
          UPDATE_ENV="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=TRUE"
          if [ -n "${ROOT_AGENT_MODEL}" ]; then
            UPDATE_ENV="${UPDATE_ENV},ROOT_AGENT_MODEL=${ROOT_AGENT_MODEL}"
          fi
          if [ -n "${SUB_AGENTS_MODEL}" ]; then
            UPDATE_ENV="${UPDATE_ENV},SUB_AGENTS_MODEL=${SUB_AGENTS_MODEL}"
          fi

          yes | adk deploy cloud_run \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --service_name="${SERVICE_NAME}" \
            --app_name="${APP_NAME}" \
            . \
            -- \
            --quiet \
            --update-env-vars="${UPDATE_ENV}"
