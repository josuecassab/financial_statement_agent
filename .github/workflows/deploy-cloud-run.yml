# Deploy the ADK financial statement agent to Cloud Run:
# https://adk-financial-statement-agent-711686050291.us-east1.run.app
#
# Required GitHub secret:
#     GCP_SA_KEY                      JSON key for a deployer SA
#
# Optional secrets (merged into the Cloud Run service if set):
#     ROOT_AGENT_MODEL
#     SUB_AGENTS_MODEL
#
# The deployer SA needs Cloud Run Admin, Service Account User, Cloud Build Editor,
# Artifact Registry Writer, and Storage Admin (source uploads).

name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: pf-zerogasto-dev
  REGION: us-east1
  SERVICE_NAME: adk-financial-statement-agent

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        env:
          ROOT_AGENT_MODEL: ${{ secrets.ROOT_AGENT_MODEL }}
          SUB_AGENTS_MODEL: ${{ secrets.SUB_AGENTS_MODEL }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          REVISION_SUFFIX="gha${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          UPDATE_ENV="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,GIT_SHA=${GITHUB_SHA}"
          if [ -n "${ROOT_AGENT_MODEL}" ]; then
            UPDATE_ENV="${UPDATE_ENV},ROOT_AGENT_MODEL=${ROOT_AGENT_MODEL}"
          fi
          if [ -n "${SUB_AGENTS_MODEL}" ]; then
            UPDATE_ENV="${UPDATE_ENV},SUB_AGENTS_MODEL=${SUB_AGENTS_MODEL}"
          fi

          gcloud run deploy "${SERVICE_NAME}" \
            --source=. \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --quiet \
            --revision-suffix="${REVISION_SUFFIX}" \
            --update-env-vars="${UPDATE_ENV}" \
            --update-labels="git-sha=${SHORT_SHA},managed-by=github-actions"

          IMAGE="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(spec.template.spec.containers[0].image)')"
          REVISION="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.latestReadyRevisionName)')"

          echo "Image: ${IMAGE}"
          echo "Revision: ${REVISION}"

          case "${IMAGE}" in
            *cloudrun/container/hello*)
              echo "Deploy reported success but the service is still the Cloud Run sample image." >&2
              exit 1
              ;;
          esac

          echo "${REVISION}" | grep -q "${REVISION_SUFFIX}" \
            || { echo "Expected revision suffix ${REVISION_SUFFIX}, got ${REVISION}" >&2; exit 1; }
